<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="site_title">مواعيد</title>
  <link rel="icon" type="image/png" href="assets/icon.png?v=2" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1e7a5f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Scheherazade+New:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=42" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="brand-link">
        <img src="assets/icon.png?v=2" alt="" class="brand-icon" />
        <span class="brand" data-i18n="site_title">مواعيد</span>
      </a>
      <nav class="nav">
        <a href="index.html" data-i18n="nav_home">الرئيسية</a>
        <a href="login.html" data-i18n="nav_login">تسجيل الدخول</a>
        <button type="button" class="install-nav-btn install-btn install-fab" hidden data-i18n-title="install_button" title="تثبيت">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="6" y="2" width="12" height="20" rx="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 18h4M12 7v6m0 0-2.5-2.5M12 13l2.5-2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <a id="whatsapp-fab" class="whatsapp-fab" hidden target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm0 18.02h-.01c-1.52 0-3-.41-4.29-1.18l-.31-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.39c0-4.54 3.7-8.23 8.24-8.23 2.2 0 4.27.86 5.82 2.41a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.69 8.24-8.24 8.24zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.13-.15.17-.25.25-.42.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.42-.14 0-.31-.02-.47-.02-.17 0-.43.06-.66.31-.23.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.24 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.11-.22-.17-.47-.29z"/>
          </svg>
          <span data-i18n="whatsapp_fab_label">تواصل واتساب</span>
        </a>
        <div class="lang-dropdown">
          <button type="button" id="lang-toggle" class="lang-btn" aria-haspopup="true" aria-expanded="false">
            <span class="lang-current">English</span><span class="lang-caret">▾</span>
          </button>
          <div class="lang-menu" id="lang-menu" hidden>
            <button type="button" class="lang-option" data-lang="ar">🇸🇦 العربية</button>
            <button type="button" class="lang-option" data-lang="en">🇬🇧 English</button>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="container">
    <a href="index.html" class="back-link" data-i18n="back_to_list">
      <svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      رجوع إلى القائمة
    </a>

    <div class="install-banner" hidden>
      <div class="install-banner-inner">
        <div class="install-banner-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="6" y="2" width="12" height="20" rx="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 18h4M12 7v6m0 0-2.5-2.5M12 13l2.5-2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="install-banner-text">
          <strong data-i18n="install_banner_title">ثبّت هذا الموقع كتطبيق</strong>
          <span data-i18n="install_banner_desc">وصول أسرع من شاشة هاتفك، يعمل حتى مع إنترنت ضعيف</span>
        </div>
        <button type="button" class="install-btn" data-i18n="install_button">تثبيت</button>
        <button type="button" class="install-dismiss-btn" aria-label="Close">&times;</button>
      </div>
    </div>

    <p id="offline-banner" class="offline-banner" hidden></p>

    <div class="provider-layout">
      <div id="provider-info" class="provider-info surface-card reveal">
        <p data-i18n="loading">جارٍ التحميل...</p>
      </div>

      <aside class="provider-booking-wrap">
        <section id="booking-section" class="booking-section surface-card reveal" hidden>
          <h2 class="booking-title" data-i18n="provider_book_button">احجز موعد</h2>

          <label for="date-input" data-i18n="provider_select_date">اختر التاريخ</label>
          <input type="date" id="date-input" />

          <div id="slots-status" class="slots-status"></div>
          <div id="slots-list" class="slots-grid"></div>

          <form id="booking-form" class="booking-form" hidden>
            <p class="selected-slot-line"><span data-i18n="provider_selected_slot">الموعد المختار:</span> <strong id="selected-slot-label"></strong></p>
            <label for="customer-name" data-i18n="provider_form_name">الاسم الكامل</label>
            <input type="text" id="customer-name" required data-i18n-placeholder="provider_form_name" />

            <label for="customer-phone" data-i18n="provider_form_phone">رقم الهاتف</label>
            <input type="tel" id="customer-phone" required data-i18n-placeholder="provider_form_phone_placeholder" />

            <label class="reminder-checkbox" for="reminder-checkbox">
              <input type="checkbox" id="reminder-checkbox" />
              <span data-i18n="reminder_checkbox_label">ذكّرني بهذا الموعد قبل ساعة</span>
            </label>

            <button type="submit" data-i18n="provider_form_submit">تأكيد الحجز</button>
          </form>

          <div id="booking-result" class="booking-result"></div>
        </section>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <p><span data-i18n="footer_support_label">تحتاج مساعدة؟</span> <a href="mailto:mostafamostafa1e3@gmail.com">mostafamostafa1e3@gmail.com</a></p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-messaging-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/provider.js"></script>
</body>
</html>

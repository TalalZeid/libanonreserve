<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="site_title">مواعيد</title>
  <link rel="icon" type="image/png" href="assets/icon.png?v=2" />
  <link rel="stylesheet" href="css/style.css?v=19" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="admin-body">
  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="brand-link">
        <img src="assets/icon.png?v=2" alt="" class="brand-icon" />
        <span class="brand" data-i18n="site_title">مواعيد</span>
      </a>
      <nav class="nav">
        <a href="index.html" data-i18n="nav_home">الرئيسية</a>
        <a href="login.html" data-i18n="nav_login">تسجيل الدخول</a>
        <button id="lang-toggle" class="lang-btn">English</button>
      </nav>
    </div>
  </header>

  <form id="login-form" class="auth-card">
    <div class="auth-card-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="4" y="10" width="16" height="10" rx="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M7 10V7a5 5 0 0 1 10 0v3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2 data-i18n="login_title">تسجيل الدخول</h2>
    <label for="login-email" data-i18n="admin_email">البريد الإلكتروني</label>
    <input type="email" id="login-email" required />
    <label for="login-password" data-i18n="admin_password">كلمة المرور</label>
    <input type="password" id="login-password" required />
    <button type="submit" data-i18n="admin_login_button">دخول</button>
    <p id="login-error" class="error-text"></p>
  </form>

  <div id="session-bar" class="session-bar" hidden>
    <div class="container session-bar-inner">
      <span id="session-label" class="session-label"></span>
      <button id="logout-btn" class="logout-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span data-i18n="admin_logout">تسجيل خروج</span>
      </button>
    </div>
  </div>

  <div id="admin-panel" class="dashboard" hidden>
    <aside class="dashboard-sidebar">
      <div class="dashboard-sidebar-header">
        <div>
          <h1 class="dashboard-title" data-i18n="admin_providers_list_title">مقدمو الخدمة المسجلون</h1>
          <p class="dashboard-subtitle" id="provider-count-label"></p>
        </div>
      </div>

      <button type="button" id="new-provider-btn" class="btn-primary btn-block">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span data-i18n="admin_new_provider_button">مقدم خدمة جديد</span>
      </button>

      <div id="admin-provider-list" class="provider-list-scroll"></div>
    </aside>

    <section class="dashboard-main">
      <form id="provider-form" class="dashboard-form">
        <div class="dashboard-form-header">
          <h2 id="provider-form-title" data-i18n="admin_add_provider_title">إضافة مقدم خدمة جديد</h2>
          <button type="button" id="cancel-edit-btn" class="link-btn" data-i18n="admin_cancel_edit" hidden>إلغاء</button>
        </div>

        <div class="form-section">
          <h3 class="form-section-title" data-i18n="form_section_basics">البيانات الأساسية</h3>
          <div class="form-grid-2">
            <div>
              <label for="name-ar" data-i18n="admin_name_ar">الاسم (عربي)</label>
              <input type="text" id="name-ar" required />
            </div>
            <div>
              <label for="name-en" data-i18n="admin_name_en">الاسم (إنكليزي)</label>
              <input type="text" id="name-en" required />
            </div>
          </div>

          <label for="category" data-i18n="admin_category">الفئة</label>
          <div class="inline-field-row">
            <select id="category" required></select>
            <button type="button" id="toggle-new-category" class="chip-btn" data-i18n="admin_toggle_new_category">
              + فئة جديدة
            </button>
          </div>
          <div id="new-category-box" class="expandable-box" hidden>
            <label for="new-category-ar" data-i18n="admin_new_category_name_ar">اسم الفئة (عربي)</label>
            <input type="text" id="new-category-ar" />
            <label for="new-category-en" data-i18n="admin_new_category_name_en">اسم الفئة (إنكليزي)</label>
            <input type="text" id="new-category-en" />
            <button type="button" id="add-category-btn" data-i18n="admin_add_category_button">إضافة الفئة</button>
          </div>

          <label class="toggle-row" for="featured-toggle">
            <span>
              <span data-i18n="admin_featured_label">موصى به من الجمعية</span><br />
              <span class="hint" data-i18n="admin_featured_hint">يظهر بشارة مميزة على صفحة مقدم الخدمة</span>
            </span>
            <span class="toggle-switch">
              <input type="checkbox" id="featured-toggle" />
              <span class="toggle-slider"></span>
            </span>
          </label>
        </div>

        <div class="form-section">
          <h3 class="form-section-title" data-i18n="form_section_contact">التواصل والعنوان</h3>
          <label for="phone" data-i18n="admin_phone">رقم واتساب (بدون + وبدون مسافات، مثال: 9613xxxxxxx)</label>
          <input type="text" id="phone" required pattern="[0-9]+" />
          <label for="address" data-i18n="admin_address">العنوان</label>
          <input type="text" id="address" />
        </div>

        <div class="form-section">
          <h3 class="form-section-title" data-i18n="form_section_description">الوصف</h3>
          <div class="form-grid-2">
            <div>
              <label for="description-ar" data-i18n="admin_description_ar">وصف (عربي)</label>
              <textarea id="description-ar"></textarea>
            </div>
            <div>
              <label for="description-en" data-i18n="admin_description_en">وصف (إنكليزي)</label>
              <textarea id="description-en"></textarea>
            </div>
          </div>
        </div>

        <div class="form-section">
          <h3 class="form-section-title" data-i18n="admin_image">صورة</h3>
          <label for="image" class="dropzone">
            <img id="current-image-preview" class="dropzone-preview" hidden />
            <div class="dropzone-placeholder" id="dropzone-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 16V4M12 4l-4 4M12 4l4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span data-i18n="admin_image_dropzone_hint">اضغط لاختيار صورة</span>
            </div>
            <input type="file" id="image" accept="image/*" class="dropzone-input" />
          </label>
        </div>

        <div class="form-section">
          <h3 class="form-section-title" data-i18n="admin_location">الموقع على الخريطة</h3>
          <p class="hint" data-i18n="admin_location_hint">اضغط على الخريطة لتحديد الموقع بدقة</p>
          <div id="location-map" class="location-map"></div>
          <p id="location-readout" class="hint"></p>
        </div>

        <div class="form-section">
          <h3 class="form-section-title" data-i18n="form_section_hours">أوقات العمل</h3>
          <label data-i18n="admin_working_days">أيام العمل</label>
          <div id="working-days" class="day-pills"></div>

          <div class="form-grid-3">
            <div>
              <label for="start-time" data-i18n="admin_start_time">بداية الدوام</label>
              <input type="time" id="start-time" value="09:00" required />
            </div>
            <div>
              <label for="end-time" data-i18n="admin_end_time">نهاية الدوام</label>
              <input type="time" id="end-time" value="17:00" required />
            </div>
            <div>
              <label for="slot-minutes" data-i18n="admin_slot_minutes">مدة الموعد (بالدقائق)</label>
              <input type="number" id="slot-minutes" value="30" min="5" step="5" required />
            </div>
          </div>
        </div>

        <div class="form-section">
          <h3 class="form-section-title" data-i18n="form_section_login">دخول صاحب العمل</h3>
          <label for="owner-email" data-i18n="admin_owner_email">بريد دخول صاحب العمل (اختياري)</label>
          <div class="inline-field-row">
            <input type="email" id="owner-email" />
            <button type="button" id="toggle-new-owner" class="chip-btn" data-i18n="admin_toggle_new_owner">
              + إنشاء حساب دخول جديد لصاحب العمل
            </button>
          </div>
          <div id="new-owner-box" class="expandable-box" hidden>
            <label for="new-owner-email" data-i18n="admin_new_owner_email">البريد الإلكتروني</label>
            <input type="email" id="new-owner-email" />
            <label for="new-owner-password" data-i18n="admin_new_owner_password">كلمة المرور</label>
            <input type="password" id="new-owner-password" />
            <button type="button" id="create-owner-btn" data-i18n="admin_create_owner_button">إنشاء الحساب</button>
            <p id="create-owner-result"></p>
          </div>
        </div>

        <div class="dashboard-form-footer">
          <p id="provider-form-result"></p>
          <button type="submit" id="provider-form-submit" data-i18n="admin_save_button">حفظ</button>
        </div>
      </form>
    </section>
  </div>

  <div id="owner-panel" class="dashboard" hidden>
    <aside class="dashboard-sidebar">
      <div id="owner-provider-header" class="owner-sidebar-identity"></div>

      <nav class="owner-nav">
        <button type="button" class="owner-nav-btn active" data-view="appointments">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 3h9l3 3v15H6z" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 10h6M9 14h6M9 18h4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span data-i18n="owner_all_appointments_title">جميع المواعيد</span>
        </button>
        <button type="button" class="owner-nav-btn" data-view="day">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="5" width="18" height="16" rx="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3 10h18M8 3v4M16 3v4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span data-i18n="owner_day_title">إدارة يوم معيّن</span>
        </button>
        <button type="button" class="owner-nav-btn" data-view="closed">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="4" width="16" height="16" rx="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 9l6 6M15 9l-6 6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span data-i18n="owner_closed_days_title">الأيام المغلقة القادمة</span>
        </button>
      </nav>

      <button type="button" id="enable-push-btn" class="owner-push-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 8a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6H4c.5-.5 2-2 2-6Z" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10 19a2 2 0 0 0 4 0" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="enable-push-label" data-i18n="owner_enable_push">تفعيل إشعارات التطبيق</span>
      </button>
    </aside>

    <section class="dashboard-main">
      <div id="owner-stats" class="stats-row"></div>

      <div id="owner-view-appointments" class="owner-view">
        <h2 class="owner-view-title" data-i18n="owner_all_appointments_title">جميع المواعيد</h2>
        <div id="all-appointments-list"></div>
      </div>

      <div id="owner-view-day" class="owner-view" hidden>
        <h2 class="owner-view-title" data-i18n="owner_day_title">إدارة يوم معيّن</h2>

        <div class="owner-day-controls">
          <div class="owner-date-field">
            <label for="owner-date-input" data-i18n="provider_select_date">اختر التاريخ</label>
            <input type="date" id="owner-date-input" />
          </div>
          <button type="button" id="close-day-btn" class="owner-close-day-btn" data-i18n="owner_close_day_button">إغلاق هذا اليوم بالكامل</button>
        </div>

        <div id="owner-day-status" class="slots-status"></div>
        <div id="owner-slots-list" class="slots-grid"></div>
        <div id="owner-slot-detail"></div>
      </div>

      <div id="owner-view-closed" class="owner-view" hidden>
        <h2 class="owner-view-title" data-i18n="owner_closed_days_title">الأيام المغلقة القادمة</h2>
        <div id="closed-days-list"></div>
      </div>
    </section>
  </div>

  <main class="container">
    <p id="no-account-message" class="hint" hidden data-i18n="login_no_account"></p>
  </main>

  <div id="qr-modal" class="modal-overlay" hidden>
    <div class="modal-card surface-card">
      <button type="button" id="qr-modal-close" class="modal-close">&times;</button>
      <h3 id="qr-modal-title"></h3>
      <div id="qr-canvas" class="qr-canvas-wrap"></div>
      <p class="hint" id="qr-modal-url"></p>
      <a id="qr-download-btn" class="btn-primary btn-block" download="qr-code.png">
        <span data-i18n="admin_qr_download">تحميل رمز QR</span>
      </a>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-messaging-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/owner.js"></script>
  <script src="js/login.js"></script>
</body>
</html>

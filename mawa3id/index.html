<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="site_title">مواعيد</title>
  <link rel="icon" type="image/png" href="assets/icon.png?v=2" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1e7a5f" />
  <link rel="stylesheet" href="css/style.css?v=19" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="brand-link">
        <img src="assets/icon.png?v=2" alt="" class="brand-icon" />
        <span class="brand" data-i18n="site_title">مواعيد</span>
      </a>
      <nav class="nav">
        <a href="index.html" data-i18n="nav_home">الرئيسية</a>
        <a href="login.html" data-i18n="nav_login">تسجيل الدخول</a>
        <button type="button" class="install-nav-btn install-btn nav-install-btn" hidden title="Install">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="6" y="2" width="12" height="20" rx="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 18h4M12 7v6m0 0-2.5-2.5M12 13l2.5-2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="lang-toggle" class="lang-btn">English</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <p class="tagline" data-i18n="site_tagline">احجز موعدك مع أي مقدم خدمة في القرية</p>

    <div class="install-banner" hidden>
      <div class="install-banner-inner">
        <div class="install-banner-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="6" y="2" width="12" height="20" rx="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 18h4M12 7v6m0 0-2.5-2.5M12 13l2.5-2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="install-banner-text">
          <strong data-i18n="install_banner_title">ثبّت هذا الموقع كتطبيق</strong>
          <span data-i18n="install_banner_desc">وصول أسرع من شاشة هاتفك، يعمل حتى مع إنترنت ضعيف</span>
        </div>
        <button type="button" class="install-btn" data-i18n="install_button">تثبيت</button>
        <button type="button" class="install-dismiss-btn" aria-label="Close">&times;</button>
      </div>
    </div>
    <p id="ios-install-hint" class="hint" hidden data-i18n="ios_install_hint"></p>

    <p id="offline-banner" class="offline-banner" hidden></p>

    <input type="search" id="search-input" class="search-input" data-i18n-placeholder="search_placeholder" />
    <p id="search-suggestion" class="search-suggestion"></p>

    <div class="filters" id="category-filters"></div>

    <div id="provider-list" class="provider-grid">
      <p data-i18n="loading">جارٍ التحميل...</p>
    </div>
    <div id="load-more-container" class="load-more-container"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
